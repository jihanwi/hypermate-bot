[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m hypermate.main"
healthcheckPath = ""
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

# Persistence (spec S2)
# The SQLite DB lives at DATABASE_PATH, default /data/hypermate.db.
# Attach a Railway Volume to this service with mount path /data
# (service > Settings > Volumes; volumes are not configurable in this file).
# Without the volume, the filesystem and the DB are reset on every redeploy.

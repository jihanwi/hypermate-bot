# Deploys every push to main to Fly.io (one machine, volume-backed SQLite: --ha=false keeps it at one).
# Needs the FLY_API_TOKEN repository secret: fly tokens create deploy -x 999999h
name: Fly Deploy

on:
  push:
    branches: [main]

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --depot=false --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
